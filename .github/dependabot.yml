version: 2
updates:
  # GitHub Actions 工作流依赖（含 actions/* 版本）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"

  # 前端 npm 依赖
  - package-ecosystem: "npm"
    directory: "/geo-saa-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    # 破坏性大版本升级需人工评估，暂不自动提交（保留 minor/patch 安全更新）
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pinia"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-echarts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "echarts"
        update-types: ["version-update:semver-major"]

  # 后端 Maven 依赖
  - package-ecosystem: "maven"
    directory: "/geo-saa-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    # Spring Boot 4.x 为破坏性大版本，需人工评估，暂不自动提交（保留 3.2.x 安全补丁）
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
