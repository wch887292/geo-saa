name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 后端：Maven 编译 + 单元测试（快速失败，捕获编译/逻辑错误） ----------
  backend-compile:
    name: Backend compile & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven compile & test
        working-directory: geo-saa-backend
        # 单测为纯 Mockito（无 Spring 上下文/DB 依赖），覆盖评分公式 /
        # simulation 闸门 / 九战术校验 / 指标聚合，全部通过才允许合并
        run: mvn -B test

  # ---------- 前端：Vite 生产构建 ----------
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: geo-saa-frontend/package-lock.json
      - name: Install & build (lockfile-pinned)
        working-directory: geo-saa-frontend
        run: |
          # Windows 生成的 package-lock.json 在 Linux 上 npm ci 偶发缺 rollup
          # 原生 optional 模块（npm#4828，ci 退出码为 0 但构建时报
          # Cannot find module @rollup/rollup-linux-x64-gnu）。改用 npm install
          #（lock 存在时同样锁定版本，但对平台 optional 模块补装更鲁棒）
          npm install --no-audit --no-fund
          npm run build

  # ---------- 端到端冒烟：MySQL + Redis + 后端(dev) + smoke_test.py ----------
  smoke-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend-compile]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Import DB schema & seed data
        run: mysql -h 127.0.0.1 -u root -proot < geo-saa-backend/src/main/resources/db/init.sql
      - name: Start backend (dev profile, RabbitMQ disabled)
        working-directory: geo-saa-backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: geo_saa
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          AI_SIMULATION_ENABLED: 'true'
        run: |
          nohup mvn -B spring-boot:run > /tmp/backend.log 2>&1 &
          echo "backend starting (pid $!)"
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/system/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}*2s"; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/v1/system/health \
            || { echo "backend did not come up"; tail -n 60 /tmp/backend.log; exit 1; }
      - name: Run smoke test (direct to backend)
        env:
          SMOKE_BASE: http://127.0.0.1:8080
        run: python smoke_test.py
