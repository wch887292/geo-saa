name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 后端：Maven 编译 + 单元测试（快速失败，捕获编译/逻辑错误） ----------
  backend-compile:
    name: Backend compile & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven compile & test
        working-directory: geo-saa-backend
        # 单测为纯 Mockito（无 Spring 上下文/DB 依赖），覆盖评分公式 /
        # simulation 闸门 / 九战术校验 / 指标聚合，全部通过才允许合并
        run: mvn -B test

  # ---------- 前端：Vite 生产构建 ----------
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: geo-saa-frontend/package-lock.json
      - name: Install & build (lockfile-pinned)
        working-directory: geo-saa-frontend
        run: |
          # Windows 生成的 package-lock.json 在 Linux 上 npm ci 偶发缺 rollup
          # 原生 optional 模块（npm#4828，ci 退出码为 0 但构建时报
          # Cannot find module @rollup/rollup-linux-x64-gnu）。改用 npm install
          #（lock 存在时同样锁定版本，但对平台 optional 模块补装更鲁棒）
          npm install --no-audit --no-fund
          npm run build

  # ---------- 说明：端到端冒烟 ----------
  # 原 smoke-test job 依赖的根目录 smoke_test.py 已随重构移除（15 接口覆盖并入
  # 后端 191 单测 + 前端构建验证）。若需恢复 e2e 冒烟，建议以 Playwright /
  # pytest 套件重新落地于 scripts/e2e/ 并在此重建对应 job。
