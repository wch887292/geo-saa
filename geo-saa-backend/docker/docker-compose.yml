version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: geo-saa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: geo_saa
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - geo-saa-net
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: geo-saa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - geo-saa-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: geo-saa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - geo-saa-net

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: geo-saa-backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - geo-saa-net

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  geo-saa-net:
    driver: bridge