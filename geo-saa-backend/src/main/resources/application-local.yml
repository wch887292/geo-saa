# ============================================================
# GEO-SaaS 本地部署配置
# 监听 0.0.0.0:6007，适用于局域网访问
# 启动方式：java -jar geo-saa-backend.jar --spring.profiles.active=local
# ============================================================

server:
  port: 6007
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:geo_saa}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 本地开发开启 SQL 日志
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT
jwt:
  secret: ${JWT_SECRET:Z2VvLXNhYS1sb2NhbC1kZXYtc2VjcmV0LWtleS1wbGVhc2UtY2hhbmdlLTIwMjQ=}
  expiration: 86400000
  refresh-expiration: 604800000

# CORS（本地开发显式列出前端域名）
cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1:5173,http://192.168.0.109:5173"
  max-age: 3600

# AI 配置
ai:
  request:
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
  openai:
    api-key: ${OPENAI_API_KEY:}
    api-url: ${OPENAI_API_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4}
  simulation:
    enabled: ${AI_SIMULATION_ENABLED:true}  # 本地默认开启模拟模式

# RAG
rag:
  embedding:
    model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
    simulation-dimensions: 256
  chunk:
    size: 500
    overlap: 50
  answer:
    max-word-count: 800
  default-top-k: 5
  default-min-similarity: 0.3

# 应用配置
app:
  geo:
    collector:
      enabled: false
  rabbitmq:
    enabled: false

# 可观测性
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false  # 本地未运行 RabbitMQ，关闭其健康检查

# 日志
logging:
  level:
    root: INFO
    com.geosaa: DEBUG
    org.springframework: WARN
    org.mybatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"
