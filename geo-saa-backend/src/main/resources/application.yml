server:
  port: ${SERVER_PORT:8080}

spring:
  # 循环依赖已通过拆分 TokenBlacklistService / PasswordEncoderConfig 解决，
  # 这里保持 false（Spring Boot 默认值），让新引入的循环依赖在启动时就暴露出来。
  main:
    allow-circular-references: false
  application:
    name: geo-saa-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:geo_saa}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mvc:
    # 让未匹配的请求抛 NoHandlerFoundException，由 GlobalExceptionHandler 统一返回 404，
    # 而不是落到静态资源处理器再被兜底成 500
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 注入（Base64、>=32 字节）
  # 生成方式: openssl rand -base64 32
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# 跨域配置：默认只放行本地前端，生产环境用 CORS_ALLOWED_ORIGINS 指定确切域名（逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: 3600

# AI 配置
ai:
  request:
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT:60000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    api-url: ${OPENAI_API_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4}
  tongyi:
    api-key: ${TONGYI_API_KEY:}
    api-url: ${TONGYI_API_URL:https://dashscope.aliyuncs.com/api/v1}
  doubao:
    api-key: ${DOUBAO_API_KEY:}
    api-url: ${DOUBAO_API_URL:}
  simulation:
    enabled: ${AI_SIMULATION_ENABLED:true}  # 模拟模式，无 API Key 时返回模拟数据

# GEO 真实数据采集器（G-01）
# 默认全部关闭：显式置 enabled=true 并至少启用一个引擎 + 填入 API Key 才生效。
# 未配置时定时任务不注册、不产生任何外部调用，也绝不写入模拟数据。
app:
  geo:
    collector:
      enabled: ${GEO_COLLECTOR_ENABLED:false}
      cron: "0 30 1 * * *"
      brands: ${GEO_COLLECTOR_BRANDS:}
      probes-per-brand: ${GEO_COLLECTOR_PROBES:3}
      query-template: "请介绍一下品牌「{brand}」的产品或服务，并结合公开信息给出你的推荐意见。"
      timeout-seconds: ${GEO_COLLECTOR_TIMEOUT:20}
      perplexity:
        enabled: ${GEO_PERPLEXITY_ENABLED:false}
        api-key: ${GEO_PERPLEXITY_API_KEY:}
        api-url: ${GEO_PERPLEXITY_API_URL:https://api.perplexity.ai/chat/completions}
        model: ${GEO_PERPLEXITY_MODEL:sonar}
      openai-compat:
        enabled: ${GEO_OPENAI_COMPAT_ENABLED:false}
        api-key: ${GEO_OPENAI_COMPAT_API_KEY:}
        api-url: ${GEO_OPENAI_COMPAT_API_URL:}
        model: ${GEO_OPENAI_COMPAT_MODEL:}

