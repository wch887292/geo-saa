server {
    listen 80;
    server_name localhost;

    # ---- 安全响应头（生产加固）----
    # 前端为纯静态 SPA + JSON API，不引用任何外部 CDN 资源，
    # 因此可以安全收紧 CSP。注意 connect-src 必须放行 'self'
    # 与可能的 AI 网关；如需接入第三方模型端点，在此追加白名单域名。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # 容器健康检查端点：仅供容器编排探活，不经过后端，避免探活失败被误判为业务故障
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带 hash 的静态资源可长期强缓存；index.html 绝不缓存，
    # 否则前端发版后用户会一直拿到旧入口文件引用旧 chunk。
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 后端登录限流依赖真实客户端 IP，这三个头必须保留。
        # 注意：X-Forwarded-For 可被客户端伪造，若未在上层反代强制覆写，
        # IP 限流可被绕过——生产环境请在最外层网关覆写该头。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 内容生成是同步长耗时调用，超时需放宽，避免网关先断开
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }
}